      (function () {
        var supported = ["ka", "ru", "en"];
        var target = "ka";
        var list = navigator.languages || [navigator.language || ""];
        for (var i = 0; i < list.length; i++) {
          var code = String(list[i]).slice(0, 2).toLowerCase();
          if (supported.indexOf(code) !== -1) { target = code; break; }
        }
